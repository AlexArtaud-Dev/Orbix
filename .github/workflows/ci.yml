name: CI

on:
  push:
  pull_request:
    branches: [master]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm', cache-dependency-path: backend/pnpm-lock.yaml }
      - run: cd backend && pnpm install --frozen-lockfile
      - run: cd backend && pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://orbix:dummy@localhost:5432/orbix
      - run: cd backend && pnpm run lint
      - run: cd backend && pnpm exec tsc --noEmit

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: orbix_test
          POSTGRES_USER: orbix
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm', cache-dependency-path: backend/pnpm-lock.yaml }
      - run: cd backend && pnpm install --frozen-lockfile
      - run: cd backend && pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://orbix:test@localhost:5432/orbix_test
      - run: cd backend && pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://orbix:test@localhost:5432/orbix_test
      - run: cd backend && pnpm run test:cov
        env:
          DATABASE_URL: postgresql://orbix:test@localhost:5432/orbix_test
          JWT_SECRET: test-secret-minimum-32-chars-long-ok
          VAULT_ENCRYPTION_KEY: test-vault-key-minimum-32-chars-long-ok

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm', cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: cd frontend && pnpm run lint
      - run: cd frontend && pnpm exec tsc --noEmit

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm', cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: cd frontend && pnpm run test

  build-docker:
    runs-on: ubuntu-latest
    needs: [lint-backend, test-backend, lint-frontend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t orbix-backend:ci -f Dockerfile.backend .
      - run: docker build -t orbix-frontend:ci -f Dockerfile.frontend --build-arg NEXT_PUBLIC_API_URL=http://localhost:3001 .
